version: "3.8"

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - RENTABUDDY_SECRET=${RENTABUDDY_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - APP_URL=${APP_URL}
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
